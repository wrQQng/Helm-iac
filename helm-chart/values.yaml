backend:
  image: <amazonID>.dkr.ecr.eu-central-1.amazonaws.com/staging-todo-app-backend
  tag: <It will automatically use the latest image tag from ECR>
  containerPort: 3000
  resources:
    requests:
      memory: "128Mi"
      cpu: "500m"
    limits:
      memory: "256Mi"
      cpu: "1"
  probes:
    startupProbe:
      httpGet:
        path: /health
        port: 3000
      failureThreshold: 30
      periodSeconds: 2
    livenessProbe:
      httpGet:
        path: /health
        port: 3000
      periodSeconds: 10
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /health
        port: 3000
      initialDelaySeconds: 0
      periodSeconds: 5
      failureThreshold: 3
frontend:
  image: <amazonID>.dkr.ecr.eu-central-1.amazonaws.com/staging-todo-app-frontend
  tag: <It will automatically use the latest image tag from ECR>
  resources:
    requests:
      memory: "64Mi"
      cpu: "250m"
    limits:
      memory: "128Mi"
      cpu: "500m"
  probes:
    liveness:
      path: /
      port: 80
      periodSeconds: 10
      failureThreshold: 3
    readiness:
      path: /
      port: 80
      periodSeconds: 5
      failureThreshold: 3
ingress:
  className: alb
  scheme: internet-facing
  targetType: ip
hpa:
  minReplicas: 1
  maxReplicas: 5
  CPUUtilization: 50
postgres:
  host: "<put_your_db_host_here>"
  port: 5432
  dbName: mydb
  user: appuser
  password: "very_secure_password"
